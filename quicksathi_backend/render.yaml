# render.yaml — Render deployment configuration for QuickSathi Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: quicksathi-backend
    runtime: node
    region: singapore   # Closest to India — cuts ~200ms vs oregon/frankfurt
    plan: free       # change to: starter, standard, etc. for production
    rootDir: quicksathi_backend # Tell Render to look inside this folder

    # ── Build & Start ──
    buildCommand: npm ci
    startCommand: npm start

    # ── Health Check ──
    # Render pings this URL to confirm the service is healthy after deploy
    healthCheckPath: /api/health

    # ── Environment Variables ──
    # Set these in the Render dashboard: https://dashboard.render.com
    # → Your Service → Environment → Add Environment Variable
    #
    # DO NOT put real secret values here — this file is committed to git.
    # The "value" fields below are just documentation placeholders.
    envVars:
      - key: NODE_ENV
        value: production

      # Same Node major as CI (.github/workflows/ci.yml); "engines" alone would let Render pick a newer one.
      - key: NODE_VERSION
        value: "22"

      # PORT is injected by Render; do not set it here.

      # MongoDB Atlas connection string
      # ⚠️  Include the database name before '?':
      #     mongodb+srv://user:pass@cluster.mongodb.net/quicksathi?appName=...
      - key: MONGODB_URI
        sync: false   # means: set this manually in Render dashboard

      # JWT
      - key: JWT_SECRET
        sync: false   # REQUIRED — use a strong random string in production

      - key: JWT_EXPIRES_IN
        value: 7d

      # Frontend URL (your Vercel URL) — used for CORS
      - key: CLIENT_URL
        sync: false   # e.g. https://quicksathi.vercel.app

      # Admin emails (comma-separated). Informational only: admin rights come from scripts/grant-admin.mjs.
      - key: ADMIN_EMAILS
        sync: false

      # Firebase Admin SDK (copy from your service account JSON)
      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_CLIENT_EMAIL
        sync: false

      - key: FIREBASE_PRIVATE_KEY
        sync: false   # paste the full -----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY----- string

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email: Brevo HTTP API (preferred). Sender must be verified in Brevo.
      - key: BREVO_API_KEY
        sync: false

      - key: BREVO_SENDER_EMAIL
        sync: false   # e.g. support@tiptobook.com

      - key: BREVO_SENDER_NAME
        value: TiptoBook

      # Email fallback: SMTP (Brevo relay by default; set SMTP_HOST only to use another provider)
      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: SMTP_SENDER
        sync: false   # e.g. "TiptoBook" <support@tiptobook.com>

      # Extra exact origins allowed by CORS (comma list), e.g. a staging frontend; optional
      - key: CORS_ORIGINS
        sync: false

      # Preview-deployment host suffixes allowed by CORS (comma list); use your own project/team suffix
      - key: CORS_ORIGIN_PATTERNS
        value: -quicksathi9-3638s-projects.vercel.app

      # Reverse proxies in front of the app (Render: 1)
      - key: TRUST_PROXY
        value: "1"

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Razorpay webhook signing secret (Dashboard → Webhooks → your endpoint → Secret)
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Groq AI
      - key: GROQ_API_KEY
        sync: false

      # Render's free plan sleeps when idle: ping this service's own public URL every 14 minutes
      # (e.g. https://quicksathi-backend.onrender.com). Leave unset on hosts that don't sleep.
      - key: SELF_PING_URL
        sync: false
