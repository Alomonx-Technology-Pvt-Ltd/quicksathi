<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4fd8" />

    <!-- Primary SEO -->
    <title>TiptoBook — Trusted Local Services at Your Doorstep</title>

      content="TiptoBook connects you with trusted local professionals for home services, repairs, cleaning, weddings, car rentals, CCTV installation, and more."

      property="og:title"
      content="TiptoBook — Trusted Local Services at Your Doorstep"
    />

      property="og:description"
      content="Find trusted local professionals for home services, repairs, weddings, car rentals, CCTV services and more."
