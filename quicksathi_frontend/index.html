<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4fd8" />
    <meta name="google-site-verification" content="GCiCxHz7zaWncurY1QNrl7VWbunZS4HN-qs7W-5A4yo" />

    <!-- Primary SEO -->
    <title>TiptoBook — Trusted Local Services at Your Doorstep</title>
    <meta
      name="description"
      content="TiptoBook connects you with trusted local professionals for home services, repairs, cleaning, weddings, car rentals, CCTV installation, and more."
    />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="local services, home services, wedding services, car rental, CCTV installation, trusted professionals, TiptoBook, book services online, Bihar services" />
    <meta name="author" content="TiptoBook" />
    <link rel="canonical" href="https://www.tiptobook.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="TiptoBook — Trusted Local Services at Your Doorstep"
    />
    <meta
      property="og:description"
      content="Find trusted local professionals for home services, repairs, weddings, car rentals, CCTV services and more."
    />
    <meta property="og:url" content="https://www.tiptobook.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TiptoBook" />
    <meta property="og:image" content="https://www.tiptobook.com/logo-full.png" />
    <meta property="og:locale" content="en_IN" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TiptoBook — Trusted Local Services at Your Doorstep" />
    <meta name="twitter:description" content="Find trusted local professionals for home services, repairs, weddings, car rentals, CCTV services and more." />
    <meta name="twitter:image" content="https://www.tiptobook.com/logo-full.png" />

    <!-- JSON-LD Structured Data: Organization + WebSite + LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "TiptoBook",
          "url": "https://www.tiptobook.com",
          "logo": "https://www.tiptobook.com/logo-full.png",
          "description": "TiptoBook connects you with trusted local professionals for home services, repairs, cleaning, weddings, car rentals, CCTV installation, and more.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "TiptoBook",
          "url": "https://www.tiptobook.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.tiptobook.com/services?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "ProfessionalService",
          "name": "TiptoBook",
          "url": "https://www.tiptobook.com",
          "logo": "https://www.tiptobook.com/logo-full.png",
          "image": "https://www.tiptobook.com/logo-full.png",
          "description": "Trusted local service marketplace — book vetted professionals for weddings, car rentals, CCTV, home repairs, and more.",
          "serviceType": ["Home Services", "Wedding Services", "Car Rental", "CCTV Installation", "Home Repairs", "Cleaning Services"],
          "areaServed": {
            "@type": "Country",
            "name": "India"
          },
          "priceRange": "$$"
        }
      ]
    }
    </script>

    <!-- Google Fonts via <link> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
